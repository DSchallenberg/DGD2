<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crownless Court</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section id="lobby" class="panel">
      <h1>Crownless Court</h1>
      <p class="subtitle">Das höfische Kartenspiel um Rang und Einfluss.</p>
      <div class="grid">
        <label>
          Dein Name
          <input id="nameInput" type="text" placeholder="Name" />
        </label>
        <label>
          Raum
          <input id="roomInput" type="text" placeholder="z.B. hof-1" />
        </label>
        <label>
          Spieleranzahl (4–8)
          <input id="playersInput" type="number" min="4" max="8" value="4" />
        </label>
        <label>
          Runden (1–30)
          <input id="roundsInput" type="number" min="1" max="30" value="10" />
        </label>
        <label class="toggle">
          Bots auffüllen
          <input id="autoBotsInput" type="checkbox" />
        </label>
      </div>
      <div class="actions">
        <button id="createBtn">Raum erstellen</button>
        <button id="joinBtn" class="secondary">Beitreten</button>
        <button id="botBtn" class="secondary">Bot hinzufügen</button>
        <button id="startBtn" class="primary">Spiel starten</button>
        <button id="copyLinkBtn" class="secondary">Einladungslink kopieren</button>
      </div>
    </section>

    <section id="game" class="panel hidden">
      <header class="game-header">
        <div>
          <h2 id="roomTitle">Raum</h2>
          <p id="roundInfo">Runde 0 / 0</p>
        </div>
        <div class="status">
          <span id="turnInfo">Warten…</span>
          <span id="phaseInfo">Lobby</span>
        </div>
      </header>

      <section class="layout">
        <div class="left">
          <div class="scoreboard">
            <h3>Rang & Punkte</h3>
            <ul id="scoreList"></ul>
          </div>
          <div class="trick">
            <h3>Aktueller Stich</h3>
            <p id="trickInfo">Noch kein Stich.</p>
          </div>
          <div class="exchange">
            <h3>Austausch</h3>
            <p id="exchangeInfo">Kein Austausch aktiv.</p>
          </div>
        </div>

        <div class="right">
          <div class="chat">
            <h3>Hofchat</h3>
            <div id="chatLog" class="chat-log"></div>
            <div class="chat-input">
              <input id="chatInput" type="text" placeholder="Nachricht..." />
              <button id="chatSend">Senden</button>
            </div>
          </div>
        </div>
      </section>

      <section class="hand">
        <h3>Deine Hand</h3>
        <div id="handCards" class="cards"></div>
        <div class="hand-actions">
          <button id="playBtn" class="primary">Ausgewählte spielen</button>
          <button id="passBtn" class="secondary">Passen</button>
          <button id="exchangeBtn" class="secondary">Austausch senden</button>
        </div>
      </section>

      <section id="banner" class="banner hidden"></section>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
